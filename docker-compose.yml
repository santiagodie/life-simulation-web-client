services:
  # Requires life-simulation-service running on the host (its docker compose exposes port 8080)
  trabajo-individual:
    image: trabajo-individual
    build: .
    ports:
      - "8081:8081"
    environment:
      - SERVICIO_URL=${SERVICIO_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
